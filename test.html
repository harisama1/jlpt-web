<!doctype html><meta charset="utf-8"><title>test</title>
<div class="app"><aside><span id="sideCount"></span><nav id="sideLinks"></nav><button id="themeBtn"></button></aside>
<header><span id="topCount"></span></header><main id="main"></main><nav id="bottomNav"></nav></div>
<pre id="out" style="font:14px monospace;white-space:pre-wrap"></pre>
<script>
const ERR = [];
window.onerror = (m, s, l) => { ERR.push(m + ' @' + l); };
const _sync = n => { const x = new XMLHttpRequest(); x.open('GET', 'data/' + n + '.json', false); x.send(); return JSON.parse(x.responseText); };
const CACHE = {};
window.fetch = url => { const n = url.replace('data/', '').replace('.json', ''); CACHE[n] = CACHE[n] || _sync(n);
  return Promise.resolve({ ok: true, json: () => Promise.resolve(CACHE[n]) }); };
try { localStorage.clear(); } catch (e) {}
</script>
<script src="app.js"></script>
<script>
(async () => {
  for (let i = 0; i < 80; i++) await null;
  const out = [], bad = [];
  const fail = (what, q) => bad.push(what + ' :: ' + JSON.stringify(q && { a: q.opts && q.opts[q.answer], o: q.opts, p: (q.prompt || '').slice(0, 60) }));
  const checkQ = (name, q, extra) => {
    if (!q) return fail(name + ' null', q);
    if (q.opts.length !== 4) return fail(name + ' opts!=4', q);
    if (new Set(q.opts).size !== 4) return fail(name + ' dup opts', q);
    if (q.opts.some(o => !String(o).trim())) return fail(name + ' empty opt', q);
    if (extra) extra(q);
  };
  try {
    out.push('data: vocab ' + DB.vocab.length + ', kanji ' + DB.kanji.length + ', gq ' + DB.gq.length + ', sent ' + DB.sentences.length + ', syn ' + DB.synonyms.length);
    const byW = {}; DB.vocab.forEach(v => (byW[v.w] = byW[v.w] || []).push(v));
    for (const mode of ['mean', 'read', 'rev']) { let n = 0;
      for (const t of ['all', ...DB.topics.map(t => t.id)]) for (const lv of ['all', 'N5', 'N3']) {
        UI.vTopic = t; UI.vLv = lv;
        for (let i = 0; i < 8; i++) { const q = vocabQ(mode); if (!q) continue; n++; const v = DB.vById[q.id];
          checkQ('vocab/' + mode, q, q => { const same = byW[v.w], wrong = q.opts.filter((o, i) => i !== q.answer);
            if (mode === 'mean' && wrong.some(o => same.some(x => x.vi === o))) fail('vocab/mean ambiguous', q);
            if (mode === 'read' && wrong.some(o => same.some(x => x.r === o))) fail('vocab/read ambiguous', q);
            if (mode === 'rev' && wrong.some(o => DB.vocab.some(x => x.w === o && x.vi === v.vi))) fail('vocab/rev ambiguous', q); }); } }
      out.push('vocab ' + mode + ': ' + n + ' câu'); }
    for (const mode of ['hv', 'word', 'wread']) { let n = 0;
      for (const lv of ['all', 'N5', 'N4', 'N3']) { UI.kLv = lv; for (let i = 0; i < 150; i++) { const q = kanjiQ(mode); if (q) { n++; checkQ('kanji/' + mode, q); } } }
      out.push('kanji ' + mode + ': ' + n + ' câu'); }
    for (const lv of ['all', 'N5', 'N4', 'N3']) { UI.gLv = lv; for (let i = 0; i < 200; i++) checkQ('grammar ' + lv, grammarQ()); }
    for (const k of ['all', '文脈規定', '言い換え']) { UI.sKind = k; for (let i = 0; i < 150; i++) checkQ('sent ' + k, sentQ()); }
    let ns = 0;
    for (const pos of ['all', 'n', 'v', 'a', 'd']) for (const lv of ['all', 'N4', 'N3']) { UI.yPos = pos; UI.yLv = lv;
      for (let i = 0; i < 40; i++) { const q = synQ(); if (!q) continue; ns++; checkQ('syn', q, q => { const y = DB.yById[q.id]; if (q.opts.includes(y.w)) fail('syn: word among options', q); }); } }
    for (let i = 0; i < 300; i++) checkQ('mix', mixQ());
    out.push('grammar 800 · mẫu câu 450 · đồng nghĩa ' + ns + ' · trộn 300 câu');
    UI.vTopic = 'all'; UI.vLv = 'all'; UI.kLv = 'all'; UI.gLv = 'all'; UI.sKind = 'all'; UI.yPos = 'all'; UI.yLv = 'all';
    const play = (name, n) => {      // answer n questions (2 of 3 right), passing result screens
      for (let i = 0; i < n; i++) {
        const again = $('.again'); if (again) { again.click(); continue; }
        const opts = $$('.stage .opt'); if (opts.length !== 4) { fail(name + ' dom opts ' + opts.length); return; }
        (i % 3 ? opts.find(o => o.dataset.i === '0') : opts.find(o => o.dataset.i !== '0')).click();
        if ($('.stage .fb').hidden) fail(name + ' feedback hidden');
        if (i % 2) $('.stage .next').click(); else document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
      }
    };
    let results = 0;
    const obs = () => { if ($('.result')) results++; };
    for (const [tab, key, modes] of [['vocab', 'vMode', ['mean', 'read', 'rev', 'list']], ['kanji', 'kMode', ['hv', 'word', 'wread', 'list']], ['grammar', 'gView', ['quiz', 'list']], ['syn', null, ['x']], ['sent', null, ['x']], ['mix', null, ['x']]]) {
      for (const m of modes) { if (key) UI[key] = m; UI.tab = tab; render();
        if (m === 'list') { if (!$('.wlist')) fail(tab + ' list missing'); const inp = $('#listq'); inp.value = 'a'; inp.dispatchEvent(new Event('input')); continue; }
        if (tab !== 'mix' && !$('.drill .filters')) fail(tab + ' drill layout missing');
        for (let i = 0; i < 25; i++) { play(tab + '/' + m, 1); obs(); } }
    }
    out.push('trang ôn: lượt chơi qua ' + results + ' màn kết quả; đã lưu ' + Object.keys(S.r).length + ' mục, lỗi sai ' + Object.keys(S.m).length);
    for (const r of DB.reading) {
      UI.tab = 'read'; UI.read = r.id; render();
      $$('.rq').forEach(box => { const ok = $$('.opt', box).find(b => r.blanks.concat(r.questions).some(x => x.a === b.dataset.v)); if (ok) ok.click(); });
      const sc = $('#readScore .score'); if (!sc) fail('read ' + r.id + ' no score'); else if (!/(\d+)\/\1/.test(sc.textContent)) fail('read ' + r.id + ' score ' + sc.textContent);
    }
    out.push('đọc hiểu: ' + DB.reading.length + ' bài');
    for (const sec of ['vocab', 'kanji', 'grammar', 'sent', 'syn']) {
      UI.tab = 'miss'; UI.miss = sec; render();
      if (Object.values(S.m).some(m => m.sec === sec) && $$('.opt').length !== 4) fail('miss review ' + sec);
      else if (Object.values(S.m).some(m => m.sec === sec)) play('miss ' + sec, 3);
    }
    for (const t of ['miss', 'more', 'home', 'read']) { UI.tab = t; UI.miss = null; UI.read = null; render(); }
    UI.tab = 'home'; render();
    out.push('trang chính: ' + ($('.hero') ? 'OK' : 'thiếu') + ' · nav: ' + $$('#sideLinks button').length + ' + ' + $$('#bottomNav button').length + ' nút');
  } catch (e) { ERR.push('EXC ' + e.message + ' ' + (e.stack || '').split('\n')[1]); }
  document.getElementById('main').innerHTML = '';
  document.getElementById('out').textContent = out.join('\n') + '\n\nLỖI LOGIC: ' + bad.length + '\n' + [...new Set(bad)].slice(0, 25).join('\n') + '\n\nLỖI JS: ' + ERR.length + '\n' + ERR.slice(0, 10).join('\n');
})();
</script>
